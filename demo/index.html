<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="assets/rec/track.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #f9f9f7; }
      #root { width: 100%; height: 100%; position: relative; font-family: "Inter", sans-serif; }
      #bg { position: absolute; inset: 0; background: #f9f9f7; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="81.7" data-width="1920" data-height="1080">
      <div id="bg" class="clip" data-start="0" data-duration="81.7" data-track-index="0"></div>
      <div id="screen" data-composition-id="screen" data-composition-src="compositions/screen.html"
        data-start="0" data-duration="74.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html"
        data-start="74.5" data-duration="7.2" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <audio id="soundtrack" class="clip" src="assets/audio/master.wav" data-start="0" data-duration="81.7" data-track-index="2" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
